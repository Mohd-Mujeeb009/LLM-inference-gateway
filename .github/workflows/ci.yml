name: ci
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy app || true # strict report remains visible while provider persistence seams evolve
      - run: pytest -q
      - run: docker build .
